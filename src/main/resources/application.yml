spring:
  application:
    name: ledger
  profiles:
    default: local
  jackson:
    deserialization:
      # Money is integer minor units: {"amount": 10.5} must be rejected, not silently truncated to 10.
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm from keycloak/ledger-realm.json. The issuer is resolved lazily on the first token.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/ledger}

springdoc:
  swagger-ui:
    # Keep the pasted token across page reloads while trying endpoints.
    persist-authorization: true
    operations-sorter: method
  # Production: set springdoc.api-docs.enabled=false and springdoc.swagger-ui.enabled=false (DECISIONS 20).

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

---
# Local development: app on the host, dependencies from `docker compose up -d postgres keycloak`.
# Personal overrides go in application-local.yml, which is git-ignored.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USERNAME:ledger}
    password: ${DB_PASSWORD:ledger}
